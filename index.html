<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SFO — airport simulation</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
